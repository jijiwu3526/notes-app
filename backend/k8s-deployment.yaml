{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "notes-backend-service"
  },
  "spec": {
    "selector": {
      "app": "notes-backend"
    },
    "ports": [
      {
        "protocol": "TCP",
        "port": 80,
        "targetPort": 3000
      }
    ],
    "type": "LoadBalancer"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "notes-backend-deployment"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "notes-backend"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "notes-backend"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "notes-backend",
            "image": "your-registry/notes-backend:latest",
            "ports": [
              {
                "containerPort": 3000
              }
            ],
            "env": [
              {
                "name": "NODE_ENV",
                "value": "production"
              },
              {
                "name": "PORT",
                "value": "3000"
              },
              {
                "name": "DATABASE_URL",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "database-secret",
                    "key": "url"
                  }
                }
              }
            ],
            "resources": {
              "requests": {
                "memory": "256Mi",
                "cpu": "250m"
              },
              "limits": {
                "memory": "512Mi",
                "cpu": "500m"
              }
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Secret",
  "metadata": {
    "name": "database-secret"
  },
  "type": "Opaque",
  "data": {
    "url": "bW9uZ29kYjovL3lvdXItdXNlcjpteS1wYXNzd29yZEBtb25nb2RiLWhvc3Q6MjcwMTcvbm90ZXM="  # Base64 encoded
  }
}