name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            crpi-kmkhbcvlekhjli14.cn-shanghai.personal.cr.aliyuncs.com \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push backend
        run: |
          docker build -t crpi-kmkhbcvlekhjli14.cn-shanghai.personal.cr.aliyuncs.com/caishenlaoye/notes-backend:latest ./backend
          docker push crpi-kmkhbcvlekhjli14.cn-shanghai.personal.cr.aliyuncs.com/caishenlaoye/notes-backend:latest

      - name: Build and push frontend
        run: |
          docker build -t crpi-kmkhbcvlekhjli14.cn-shanghai.personal.cr.aliyuncs.com/caishenlaoye/notes-frontend:latest ./frontend
          docker push crpi-kmkhbcvlekhjli14.cn-shanghai.personal.cr.aliyuncs.com/caishenlaoye/notes-frontend:latest
